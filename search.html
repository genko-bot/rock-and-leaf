---
layout: default
title: Search Results
---

<h1>Search Results</h1>
<input type="text" id="search-box" placeholder="Search blog posts...">
<ul id="search-results"></ul>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lunr.js/2.3.9/lunr.min.js"></script>
<script>
  let idx;
  fetch("{{ site.baseurl }}/search.json")
    .then(response => response.json())
    .then(data => {
      idx = lunr(function () {
        this.ref("id");
        this.field("title");
        this.field("content");
        this.field("tags");

        data.forEach((doc, i) => {
          this.add(Object.assign({ id: i }, doc));
        });
      });
    });

  document.getElementById("search-box").addEventListener("input", function () {
    let query = this.value.trim();
    let results = idx.search(query);
    let resultsList = document.getElementById("search-results");
    resultsList.innerHTML = "";
    
    results.forEach(result => {
      let item = document.createElement("li");
      let link = document.createElement("a");
      link.href = data[result.ref].url;
      link.textContent = data[result.ref].title;
      item.appendChild(link);
      resultsList.appendChild(item);
    });
  });
</script>
